apiVersion: v1
kind: ServiceAccount
metadata:
  name: replication-checker
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: replication-checker
  namespace: observability
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: replication-checker
  namespace: observability
subjects:
  - kind: ServiceAccount
    name: replication-checker
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: replication-checker
---
apiVersion: batch/v1
kind: Job
metadata:
  name: suse-observability-replication-check
  namespace: observability
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 960
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: replication-checker
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checker
          image: registry.example.com/observability/sts-backup:replication-checker
          args:
            - replication
            - check
            - --namespace=observability
            - --release=suse-observability
            - --wait
            - --timeout=15m
            - --stable-for=30s
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
