name: Per-target released artifact Grype scan
on:
  workflow_dispatch:
permissions: {}
jobs:
  grype:
    name: Scan each published binary separately with Grype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: released-v0.11.2-delivery-evidence
          run-id: 40716838958
          github-token: ${{ github.token }}
          path: released
      - name: Verify and unpack previously scanned published archives
        run: |
          cd released/dist
          sha256sum --check stackstate-backup-cli_0.11.2_checksums.txt
          for archive in *.tar.gz *.zip; do
            target="${archive#stackstate-backup-cli-0.11.2.}"
            target="${target%.tar.gz}"
            target="${target%.zip}"
            mkdir -p "../../binaries/${target}"
            case "${archive}" in
              *.tar.gz) tar -xzf "${archive}" -C "../../binaries/${target}" ;;
              *.zip) unzip -q "${archive}" -d "../../binaries/${target}" ;;
            esac
          done
      - name: Install the repository's pinned Grype version
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/756eb9a24f7beeafb6871a24e943e8a3ae210695/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.118.0
      - name: Run informational Grype scan for each published binary
        run: |
          mkdir -p reports
          grype version > reports/grype-version.txt
          count=0
          for target in binaries/*; do
            binary="${target}/sts-backup"
            [[ -f "${binary}" ]] || binary="${target}/sts-backup.exe"
            [[ -f "${binary}" ]]
            grype "file:${binary}" --by-cve -o json > "reports/grype-$(basename "${target}").json"
            count=$((count + 1))
          done
          [[ "${count}" -eq 5 ]]
          python3 - <<'SUMMARY'
          import json, pathlib
          reports = list(pathlib.Path('reports').glob('grype-*.json'))
          assert len(reports) == 5
          assigned = {'CVE-2026-78661', 'CVE-2026-97045', 'GO-2026-6860', 'GO-2026-6866'}
          summary = []
          for report in sorted(reports):
              data = json.loads(report.read_text())
              assert data['descriptor']['version'] == '0.118.0'
              assert data['source']['type'] == 'file', data['source']
              ids = {m['vulnerability']['id'] for m in data['matches']}
              for match in data['matches']:
                  ids.update(v['id'] for v in match.get('relatedVulnerabilities', []))
              summary.append({'report': report.name, 'source': data['source'], 'assigned_findings_present': sorted(assigned & ids), 'findings': [{'id': m['vulnerability']['id'], 'package': m['artifact']['name'], 'installed': m['artifact']['version'], 'fixed': m['vulnerability'].get('fix'), 'severity': m['vulnerability']['severity']} for m in data['matches']]})
          pathlib.Path('reports/per-target-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          SUMMARY
      - name: Retain all per-target Grype reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: released-v0.11.2-per-target-grype
          path: |
            reports/
            released/dist/*_checksums.txt
            released/reports/verified-assets.json
          if-no-files-found: error
